name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # VMDefaults declares swift-tools-version 6.2, so it needs a Swift 6.2+ toolchain.
      # Pin to the newest stable Xcode on the runner.
      - name: Select latest-stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      # Warnings are treated as errors: the package advertises a clean strict-concurrency build,
      # so any new warning (e.g. a #SendableMetatypes regression) must fail CI. This also compiles
      # the Examples/ target, keeping the snippets in sync with the public API.
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test (warnings as errors)
        run: swift test -Xswiftc -warnings-as-errors
